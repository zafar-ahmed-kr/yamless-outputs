apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pos-service-instore-rems-ingest-manager-secrets
  namespace: pos-service-instore-rems-ingest-manager
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${module.aks_workload_identity.client_id}"
    keyvaultName: "${module.keyvault.name}"
    tenantId: "${data.azurerm_client_config.current.tenant_id}"
    objects: |
      array:
        - |
          objectName: servicebus-connection-string
          objectType: secret
  secretObjects:
  - secretName: servicebus-connection-string
    type: Opaque
    data:
    - objectName: servicebus-connection-string
      key: value
