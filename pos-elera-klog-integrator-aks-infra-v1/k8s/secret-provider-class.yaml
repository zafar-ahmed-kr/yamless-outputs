apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pos-elera-klog-integrator-secrets
  namespace: pos-elera-klog-integrator
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${module.aks_workload_identity.client_id}"
    keyvaultName: "${module.keyvault.name}"
    tenantId: "${data.azurerm_client_config.current.tenant_id}"
    objects: |
      array:
        - |
          objectName: storage-connection-string
          objectType: secret
        - |
          objectName: servicebus-connection-string
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
        - |
          objectName: mssql-sa-password
          objectType: secret
  secretObjects:
  - secretName: storage-connection-string
    type: Opaque
    data:
    - objectName: storage-connection-string
      key: value
  - secretName: servicebus-connection-string
    type: Opaque
    data:
    - objectName: servicebus-connection-string
      key: value
  - secretName: redis-url
    type: Opaque
    data:
    - objectName: redis-url
      key: value
  - secretName: mssql-sa-password
    type: Opaque
    data:
    - objectName: mssql-sa-password
      key: value
