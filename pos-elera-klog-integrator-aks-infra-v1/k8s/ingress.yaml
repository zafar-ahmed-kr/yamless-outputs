apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-elera-klog-integrator
  namespace: pos-elera-klog-integrator
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: pos-elera-klog-integrator
    app.kubernetes.io/managed-by: yamless
spec:
  rules:
    - host: pos-elera-klog-integrator.example.com  # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-elera-klog-integrator
                port:
                  number: 80
