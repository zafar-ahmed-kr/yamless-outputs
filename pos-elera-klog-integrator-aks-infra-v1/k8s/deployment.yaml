apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-elera-klog-integrator
  namespace: pos-elera-klog-integrator
  labels:
    app.kubernetes.io/name: pos-elera-klog-integrator
    app.kubernetes.io/managed-by: yamless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pos-elera-klog-integrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pos-elera-klog-integrator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: pos-elera-klog-integrator
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pos-elera-klog-integrator
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pos-elera-klog-integrator
      containers:
        - name: pos-elera-klog-integrator
          image: ${var.image}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1.6Gi
            limits:
              cpu: 500m
              memory: 3Gi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          env:
            - name: STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: storage-connection-string
                  key: value
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: servicebus-connection-string
                  key: value
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-url
                  key: value
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-sa-password
                  key: value
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: pos-elera-klog-integrator-secrets
