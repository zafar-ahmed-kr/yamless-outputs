apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pos-service-business-day-scheduler-secrets
  namespace: pos-service-business-day-scheduler
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${module.aks_workload_identity.client_id}"
    keyvaultName: "${module.keyvault.name}"
    tenantId: "${data.azurerm_client_config.current.tenant_id}"
    objects: |
      array:
        - |
          objectName: batch-service-base-url
          objectType: secret
        - |
          objectName: oauth-password
          objectType: secret
        - |
          objectName: oauth-username
          objectType: secret
        - |
          objectName: ping-client-id
          objectType: secret
        - |
          objectName: ping-grant-type
          objectType: secret
        - |
          objectName: ping-issuer-uri
          objectType: secret
        - |
          objectName: ping-redirect-uri
          objectType: secret
        - |
          objectName: ping-response-mode
          objectType: secret
        - |
          objectName: ping-response-type
          objectType: secret
        - |
          objectName: ping-scope
          objectType: secret
  secretObjects:
  - secretName: batch-service-base-url
    type: Opaque
    data:
    - objectName: batch-service-base-url
      key: value
  - secretName: oauth-password
    type: Opaque
    data:
    - objectName: oauth-password
      key: value
  - secretName: oauth-username
    type: Opaque
    data:
    - objectName: oauth-username
      key: value
  - secretName: ping-client-id
    type: Opaque
    data:
    - objectName: ping-client-id
      key: value
  - secretName: ping-grant-type
    type: Opaque
    data:
    - objectName: ping-grant-type
      key: value
  - secretName: ping-issuer-uri
    type: Opaque
    data:
    - objectName: ping-issuer-uri
      key: value
  - secretName: ping-redirect-uri
    type: Opaque
    data:
    - objectName: ping-redirect-uri
      key: value
  - secretName: ping-response-mode
    type: Opaque
    data:
    - objectName: ping-response-mode
      key: value
  - secretName: ping-response-type
    type: Opaque
    data:
    - objectName: ping-response-type
      key: value
  - secretName: ping-scope
    type: Opaque
    data:
    - objectName: ping-scope
      key: value
